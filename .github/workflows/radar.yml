name: Radar de Reddit

# Busca conversaciones donde Gate32 sería una respuesta útil y abre una issue
# con el resumen. GitHub manda un correo con cada issue nueva, así que no hay
# que entrar a mirar nada. No publica en Reddit: eso lo hace una persona.

on:
  schedule:
    - cron: "0 7,19 * * *" # dos pasadas al día (UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sin credenciales: usa los feeds RSS públicos de Reddit.
      - name: Buscar hilos
        run: node scripts/radar.mjs

      # Si esto falla, el trabajo falla y GitHub avisa. Antes llevaba `|| true`
      # y durante cuatro días el radar no reportó nada: la etiqueta `radar` no
      # existía en el repositorio, `gh issue create` abortaba sin crear la
      # issue, el error se tragaba y el paso siguiente daba por vistos hilos
      # que nadie había leído. Un radar que calla es peor que no tener radar.
      - name: Abrir issue si hay algo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s .radar-digest.md ]; then
            echo "Nada que reportar."
            exit 0
          fi
          gh label create radar \
            --color BFD4F2 \
            --description "Resúmenes automáticos del radar de Reddit" \
            2>/dev/null || true
          gh issue create \
            --title "Radar: hilos para responder ($(date -u +%d/%m))" \
            --body-file .radar-digest.md \
            --label radar

      # Sin `if:` explícito: solo corre si el paso anterior ha ido bien. Es
      # justo lo que se quiere — se olvida un hilo únicamente después de
      # haberlo contado. Repetir un hilo cuesta un vistazo; perder una
      # respuesta cuesta la conversación.
      - name: Recordar los hilos ya vistos
        run: |
          if ! git diff --quiet .radar-seen.json; then
            git config user.name "gate32-radar"
            git config user.email "radar@users.noreply.github.com"
            git add .radar-seen.json
            git commit -m "chore: radar seen list"
            git push
          fi
