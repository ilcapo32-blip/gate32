name: Avisar a los buscadores (IndexNow)

# Cuando cambia una página o el sitemap, se avisa a Bing, Yandex y compañía en
# vez de esperar a que pasen. No hay secretos: la clave de IndexNow es pública
# por diseño, se verifica porque está publicada en el propio dominio.

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "public/sitemap.xml"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sin `|| true`: si el aviso no sale, el trabajo falla y se ve.
      - run: node scripts/indexnow.mjs
